  #legend { position: absolute; top: 12px; right: 92px; max-width: calc(100vw - 430px); background: rgba(255,255,255,.94); border-radius: 10px;
            padding: 8px 12px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); line-height: 1.7; }
  #bar .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }

  .maplibregl-ctrl-group button.on .maplibregl-ctrl-icon { filter: invert(1); }

  .maplibregl-ctrl-group.keys button { width: 22px; height: 22px; border: 1px solid #ccc !important; border-radius: 4px; font: 600 11px/20px system-ui, sans-serif;
    color: #333; text-align: center; padding: 0; }

  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: rgba(30,30,30,.92); color: #fff;

  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

         background: rgba(255,255,255,.9); border: 1px solid #0002; border-radius: 4px; padding: 1px 6px; font-size: 11.5px; line-height: 1.4;
         color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .lbl::after { content: ""; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.9); }
  .lbl.C { border-color: #c98a0080; }
  .lbl.sel { border-color: #d33; font-weight: 700; }
  .lbl .more { display: inline-block; white-space: nowrap; color: #888; font-size: 10.5px; margin-left: 3px; }
  .sw { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 5px; border: 1px solid #0003; }

<div id="labels"></div>
<div id="side">
  <div id="sideHead">
    <div class="brand"><div class="ko">대지의 기억</div><div class="en">Remembrance of Earth</div></div>

<div id="legend">
  <div><span class="sw" style="background:#d9a066"></span>건물(대장 기준 현존, 사용승인 이후)</div>
  <div><span class="sw" style="background:#cfd8c4"></span>업소 근거 있는 필지</div>
  <div><span class="sw" style="background:#f4f1ea"></span>그 해 근거 없음(=없었다는 뜻 아님)</div>

    <button id="play" title="재생/정지 (스페이스)">▶ 재생</button>
    <label id="loop" title="체크하면 끝에서 처음으로 돌아가 계속 재생"><input type="checkbox" id="loopChk"> 반복</label>
    <button id="speed" title="배속">1×</button>

<script src="vendor/maplibre-gl.js"></script>
<script src="scene.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module" src="avatar.js"></script>
<script type="module" src="npc.js"></script>
<script>
const FIRST_SURVEY = 2008;  // 로드뷰 간판 조사 첫 해
init(window.SCENE);

function init(S) {
  const bizByParcel = {};
  S.businesses.forEach(b => (bizByParcel[b.jibun] ||= []).push(b));
  const evByParcel = {};
  S.building_events.forEach(e => (evByParcel[e.jibun] ||= []).push(e));
  const yr = s => s ? parseInt(s.slice(0, 4)) : null;

  // 그 해에 영업 근거가 있는 업소. 등급 A: 인허가~폐업(없으면 열림), 등급 C: 첫~마지막 간판 관찰
  function activeBiz(jibun, y) {
    return (bizByParcel[jibun] || []).filter(b => {
      if (b.grade === "C") return yr(b.sign_first) <= y && y <= yr(b.sign_last);
      const s = yr(b.start), e = yr(b.end);
      return s <= y && (e == null || y <= e);
    });
  }
  // ---- 시간 T는 소수 연도(1993.5 = 1993년 중반). 공사 중(a≤T<b)인 건물은 크레인과 함께 올라가고, 완공(T≥b)이면 전체가 보인다.
  const KXm = 111320 * Math.cos(37.559 * Math.PI / 180), KYm = 110540;
  const Tnow = () => +document.getElementById("slider").value;
  const yearOf = T => Math.floor(T + 1e-6);
  const isBuilt = (p, T) => p.a != null ? T >= p.b : p.start <= yearOf(T);
  const buildingsAt = T => S.buildings.features.filter(f => isBuilt(f.properties, T));
  const ease = p => p * p * (3 - 2 * p);
  const bldH = {};   // 건물별 최종 높이(부위 있으면 부위 최고 높이)
  S.buildings.features.forEach(f => { const p = f.properties; bldH[p.bid] = Math.max(bldH[p.bid] || 0, p.height || 0); });
  const rectLL = (c, ang, a0, a1, hw) => {   // c 기준 방향 ang(rad)으로 a0~a1 m, 폭 ±hw m 직사각형(경위도)
    const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
    return [[a0, -hw], [a1, -hw], [a1, hw], [a0, hw], [a0, -hw]].map(([a, w]) => [c[0] + (ux * a + nx * w) / KXm, c[1] + (uy * a + ny * w) / KYm]);
  };
  const cbox = (c, ang, a0, a1, hw, base, top, color) => ({ type: "Feature", geometry: { type: "Polygon", coordinates: [rectLL(c, ang, a0, a1, hw)] }, properties: { base, top, color } });
  function craneFeats(f, p, T) {   // 타워크레인: 기둥 + 회전하는 붐 + 균형추 + 매달린 짐
    const ring = f.geometry.coordinates[0], c = ringMid(ring), H = bldH[f.properties.bid] || 10;
    const mh = Math.max(12, H * ease(p) + 8), seed = f.properties.bid.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
    const ang = seed + T * 5, Y = "#f2c230";
    const hook = 12 + 3 * Math.sin(T * 40 + seed);
    return [cbox(c, 0, -0.6, 0.6, 0.6, 0, mh, Y), cbox(c, ang, -5, 14, 0.35, mh, mh + 0.9, Y), cbox(c, ang, -5, -2.6, 0.7, mh - 0.8, mh + 1.4, "#555"),
            cbox(c, 0, -0.9, 0.9, 0.9, mh, mh + 1.9, "#e8b020"), cbox(c, ang, hook - 0.08, hook + 0.08, 0.08, mh - 5, mh, "#333"),
            cbox(c, ang, hook - 0.9, hook + 0.9, 0.9, mh - 6.2, mh - 5, "#c0392b")];
  }
  const ghostColor = (g, q) => q > 0.35 ? "#8c867c" : g.color;
  let lastSig = "", lastDone = -1, curBld = [], occKey = "";
  function dyn(T) {
    const bld = [], crane = [], ghost = []; let nb = 0, prog = false;
    for (const f of S.buildings.features) {
      const p = f.properties;
      if (isBuilt(p, T)) { bld.push(f); if (!p.part) nb++; continue; }
      if (p.a == null || T < p.a) continue;
      const q = (T - p.a) / (p.b - p.a), hv = (bldH[p.bid] || p.height) * ease(q);
      prog = true;
      if (p.part) { if (p.base >= hv) continue; bld.push({ ...f, properties: { ...p, height: Math.min(p.height, hv) } }); }
      else { bld.push({ ...f, properties: { ...p, height: Math.min(p.height, hv) } }); if (p.hide !== 1) crane.push(...craneFeats(f, q, T)); }
      if (p.part && !crane.some(c => c._b === p.bid)) { const m = S.buildings.features.find(g => g.properties.bid === p.bid && !g.properties.part); if (m) { const cf = craneFeats(m, q, T); cf.forEach(x => x._b = p.bid); crane.push(...cf); } }
    }
    for (const f of S.ghosts.features) {
      const g = f.properties;
      if (T >= g.dend) continue;
      if (T < g.dstart) { ghost.push(f); continue; }
      prog = true; const q = (T - g.dstart) / (g.dend - g.dstart), k = Math.max(1 - q, 0.06), sh = Math.sin(T * 300) * 0.25 * (1 - q);
      const sx = sh / KXm;
      ghost.push({ type: "Feature", geometry: { type: "Polygon", coordinates: f.geometry.coordinates.map(r => r.map(([x, y]) => [x + sx, y])) },
                   properties: { ...g, base: g.base * k, top: Math.max(g.top * k, 0.3), color: ghostColor(g, q) } });
    }
    const sig = prog ? "p" + Math.round(T * 240) : "s" + bld.length + ":" + ghost.length;
    return { bld, crane, ghost, sig, nb };
  }
  function refreshDyn(T, force) {
    const d = dyn(T);
    if (force || d.sig !== lastSig) {
      lastSig = d.sig;
      curBld = d.bld; occKey = "";
      map.getSource("buildings").setData({ type: "FeatureCollection", features: d.bld });
      map.getSource("cranes").setData({ type: "FeatureCollection", features: d.crane });
      map.getSource("ghosts").setData({ type: "FeatureCollection", features: d.ghost });
    }
    return d.nb;
  }
  const setYearLabel = T => { const y = yearOf(T), m = Math.min(12, Math.floor((T - y) * 12 + 1e-6) + 1);
    document.getElementById("year").innerHTML = `${y}<span style="font-size:.45em;opacity:.55;margin-left:4px">${m}월</span>`; };

  const map = new maplibregl.Map({
    container: "map", style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#e9e6df" } }] },
    locale: { "NavigationControl.ZoomIn": "확대 ( = 또는 + )", "NavigationControl.ZoomOut": "축소 ( - )",
              "NavigationControl.ResetBearing": "북쪽을 위로 ( \\ )" },
    center: [126.9395, 37.5589], zoom: 17.2, pitch: 55, bearing: -20, maxPitch: 85, maxZoom: 26
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: true }));
  map.keyboard.disable();   // 방향키는 직접 처리(날기: 화면 이동, 걷기: 이동)
  const keyBtns = [];
  class Rot {
    onAdd() {
      this.el = document.createElement("div"); this.el.className = "maplibregl-ctrl maplibregl-ctrl-group rotgrid";
      // 왼쪽 열: 좌우 30° 회전, 오른쪽 열: 시점 높낮이(누르고 있으면 계속 기울어진다)
      [["↺", -30, "반시계 30° 회전 ( [ 또는 Q )"], ["↑", "KeyR", "시점 올리기 · 수평 쪽으로 ( R 또는 PageUp )"],
       ["↻", 30, "시계 30° 회전 ( ] 또는 E )"], ["↓", "KeyF", "시점 내리기 · 내려다보기 ( F 또는 PageDown )"]].forEach(([t, d, tip]) => {
        const b = document.createElement("button"); b.className = "rot"; b.textContent = t; b.title = tip;
        if (typeof d === "number") b.onclick = () => rotate(d);
        else {
          b.dataset.code = d; keyBtns.push(b);
          b.addEventListener("pointerdown", e => { e.preventDefault();
            if (walking) keys.add(d);
            else map.easeTo({ pitch: clampP(map.getPitch() + (d === "KeyR" ? 10 : -10)), duration: 250 }); });
          ["pointerup", "pointerleave"].forEach(ev => b.addEventListener(ev, () => keys.delete(d)));
        }
        this.el.appendChild(b);
      });
      return this.el;
    }
    onRemove() { this.el.remove(); }
  }
  map.addControl(new Rot());
  // 조작 키 안내: 누르고 있으면 해당 키를 누른 것과 같다(걷기 모드), ↑↓는 날기 모드에서도 시점 높이를 바꾼다
  const KEYPAD = [
    ["", null], ["W", "KeyW", "앞으로 ( W 또는 ↑ )"], ["", null],
    ["A", "KeyA", "왼쪽으로 ( A 또는 ← )"], ["S", "KeyS", "뒤로 ( S 또는 ↓ )"], ["D", "KeyD", "오른쪽으로 ( D 또는 → )"]];
  class Keys {
    onAdd() {
      this.el = document.createElement("div"); this.el.className = "maplibregl-ctrl maplibregl-ctrl-group keys";
      KEYPAD.forEach(([t, code, tipText]) => {
        if (!code) { const g = document.createElement("span"); g.className = "gap"; this.el.appendChild(g); return; }
        const b = document.createElement("button"); b.textContent = t; b.title = tipText; b.dataset.code = code;
        b.addEventListener("pointerdown", e => { e.preventDefault(); keys.add(code); });
        ["pointerup", "pointerleave"].forEach(ev => b.addEventListener(ev, () => keys.delete(code)));
        keyBtns.push(b); this.el.appendChild(b);
      });
      return this.el;
    }
    onRemove() { this.el.remove(); }
  }
  map.addControl(new Keys());
  // 키 → 버튼 대응(키를 누르는 동안 해당 버튼이 파랗게 켜진다). 단축키가 둘이면 둘 다 적용
  const litBtns = [], lit = (el, codes) => { if (el) { el.dataset.codes = codes; litBtns.push(el); } };
  const ctl = document.querySelector(".maplibregl-ctrl-group");
  lit(document.querySelector(".maplibregl-ctrl-zoom-in"), "Equal NumpadAdd");
  lit(document.querySelector(".maplibregl-ctrl-zoom-out"), "Minus NumpadSubtract");
  lit(document.querySelector(".maplibregl-ctrl-compass"), "Backslash");
  const KC = { "↺": "BracketLeft KeyQ", "↻": "BracketRight KeyE", "↑": "KeyR PageUp", "↓": "KeyF PageDown",
               W: "KeyW ArrowUp", A: "KeyA ArrowLeft", S: "KeyS ArrowDown", D: "KeyD ArrowRight" };
  document.querySelectorAll("button.rot, .keys button").forEach(b => lit(b, KC[b.textContent]));
  // 기본 title 툴팁은 환경에 따라 뜨지 않으므로 직접 그린다
  const tip = document.getElementById("tip");
  document.querySelectorAll(".maplibregl-ctrl-group button").forEach(b => {
    const t = b.title; if (!t) return; b.dataset.tip = t; b.removeAttribute("title");
    b.addEventListener("mouseenter", () => { const r = b.getBoundingClientRect();
      tip.textContent = t; tip.style.left = (r.left - 8) + "px"; tip.style.top = (r.top + r.height / 2) + "px"; tip.style.display = "block"; });
    b.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
  function rotate(d) {
    if (walking) { heading = (heading + d + 360) % 360; applyWalkCam(); }

      if (tilt) wpitch = clampW(wpitch + tilt * 60 * dt);
      if (Math.abs(wpitch - wps) > 0.02) { wps += (wpitch - wps) * Math.min(1, dt * 16); moved = true; }   // 시점은 목표값을 향해 부드럽게 따라간다
      if (occDirty && t - lastOcc > 120) { occDirty = false; lastOcc = t; updateOccluders(); }
      const f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) {
        const sp = (k("ShiftLeft") || k("ShiftRight") ? 3.5 : 1.4) * dt, h = heading * Math.PI / 180;
        const dx = (Math.sin(h) * f + Math.cos(h) * sd) * sp, dy = (Math.cos(h) * f - Math.sin(h) * sd) * sp;
        const stuck = blocked(pos[0], pos[1]);   // 연도를 바꿔 내 자리에 건물이 생겼다면 벽을 무시하고 빠져나온다
        const nx = pos[0] + dx / KX, ny = pos[1] + dy / KY;   // 벽에 막히면 한 축씩 미끄러진다
        if (stuck || !blocked(nx, ny)) pos = [nx, ny]; else if (!blocked(nx, pos[1])) pos = [nx, pos[1]]; else if (!blocked(pos[0], ny)) pos = [pos[0], ny];
        moved = true;
        const want = Math.atan2(dx, dy) * 180 / Math.PI, diff = ((want - face + 540) % 360) - 180;   // 이동 방향으로 몸을 돌린다
        face = (face + diff * Math.min(1, dt * 12) + 360) % 360;
        anim = k("ShiftLeft") || k("ShiftRight") ? "sprint" : "walk";
      } else if (anim !== "idle") { anim = "idle"; moved = true; }
      if (moved) applyWalkCam();
    } else {   // 날기 모드: W/A/S/D로 화면 기준 앞·뒤·좌·우로 지도를 민다
      const k = c => keys.has(c), f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) { const px = (k("ShiftLeft") || k("ShiftRight") ? 700 : 280) * dt; map.panBy([sd * px, -f * px], { duration: 0 }); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { lastT = t; frame(t); });
  window.__scene = S; window.__map = map; window.__walkTo = p => { pos = p; applyWalkCam(); };
}
</script>
