<div id="map"></div>
<div id="tip"></div>
<div id="labels"></div>

<div id="side">
  <div id="band1">
    <div id="sideHead">
      <div class="brand"><div class="ko">대지의 기억</div><div class="en">Remembrance of Earth</div></div>
    </div>
    <p class="intro">골목은 바뀌어도 땅은 기억합니다. 대지가 기억하는 골목과 건물, 상점의 모습을 시간 슬라이더로 보여 줍니다.</p>

      <div id="areaTools" hidden><div class="atTitle">영역 선택</div><div class="atRow"><button type="button" data-shape="rect" title="사각형: 지도를 드래그하세요">□</button><button type="button" data-shape="circle" title="원: 지름의 양 끝을 드래그">○</button><button type="button" data-shape="poly" title="다각형: 점을 클릭해 꼭짓점을 찍고 닫으세요">⬠</button></div><div id="areaHint">영역 선택 도구를 사용하여 지도를 드래그하세요. 선택된 영역은 AI가 분석합니다.</div></div>
      <div id="agLog"></div><div id="arLog" hidden></div>

      <button id="agGo">찾아보기</button>

      <div id="agChips" hidden></div>
  </div>

  </div>

<script>
const FIRST_SURVEY = 2008;  // 로드뷰 간판 조사 첫 해
init(window.SCENE);

function init(S) {
  const RG = S.region;   // config/region.json 에서 온 동네 설정(export_web.py 가 scene 에 넣는다)
  document.title = RG.title; document.getElementById("q").placeholder = RG.search_placeholder;
  const bizByParcel = {};
  S.businesses.forEach(b => (bizByParcel[b.jibun] ||= []).push(b));
  const evByParcel = {};
  S.building_events.forEach(e => (evByParcel[e.jibun] ||= []).push(e));
  const yr = s => s ? parseInt(s.slice(0, 4)) : null;
  const coreJ = new Set(S.parcels.features.map(f => f.properties.jibun));
  const anchorOf = {};   // 필지의 대표 장소 이름(창천감리교회 등): 인허가 업소가 없어도 라벨을 단다
  S.parcels.features.forEach(f => f.properties.anchor && (anchorOf[f.properties.jibun] = f.properties.anchor));

  // 그 해에 영업 근거가 있는 업소. 등급 A: 인허가~폐업(없으면 열림), 등급 C: 첫~마지막 간판 관찰
  function activeBiz(jibun, y) {
    return (bizByParcel[jibun] || []).filter(b => {
      if (b.grade === "C") return yr(b.sign_first) <= y && y <= yr(b.sign_last);
      const s = yr(b.start), e = yr(b.end);
      return s <= y && (e == null || y <= e);
    });
  }
  // ---- 시간 T는 소수 연도(1993.5 = 1993년 중반). 공사 중(a≤T<b)인 건물은 크레인과 함께 올라가고, 완공(T≥b)이면 전체가 보인다.
  const KXm = 111320 * Math.cos(37.559 * Math.PI / 180), KYm = 110540;
  const Tnow = () => +document.getElementById("slider").value;
  const yearOf = T => Math.floor(T + 1e-6);
  const isBuilt = (p, T) => p.a != null ? T >= p.b : p.start <= yearOf(T);
  const buildingsAt = T => S.buildings.features.filter(f => isBuilt(f.properties, T));
  const ease = p => p * p * (3 - 2 * p);
  const bldH = {};   // 건물별 최종 높이(부위 있으면 부위 최고 높이)
  S.buildings.features.forEach(f => { const p = f.properties; bldH[p.bid] = Math.max(bldH[p.bid] || 0, p.height || 0); });
  const rectLL = (c, ang, a0, a1, hw) => {   // c 기준 방향 ang(rad)으로 a0~a1 m, 폭 ±hw m 직사각형(경위도)
    const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
    return [[a0, -hw], [a1, -hw], [a1, hw], [a0, hw], [a0, -hw]].map(([a, w]) => [c[0] + (ux * a + nx * w) / KXm, c[1] + (uy * a + ny * w) / KYm]);
  };
  const cbox = (c, ang, a0, a1, hw, base, top, color) => ({ type: "Feature", geometry: { type: "Polygon", coordinates: [rectLL(c, ang, a0, a1, hw)] }, properties: { base, top, color } });
  function craneFeats(f, p, T) {   // 타워크레인: 기둥 + 회전하는 붐 + 균형추 + 매달린 짐
    const ring = f.geometry.coordinates[0], c = ringMid(ring), H = bldH[f.properties.bid] || 10;
    const mh = Math.max(12, H * ease(p) + 8), seed = f.properties.bid.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
    const ang = seed + T * 5, Y = "#f2c230";
    const hook = 12 + 3 * Math.sin(T * 40 + seed);
    return [cbox(c, 0, -0.6, 0.6, 0.6, 0, mh, Y), cbox(c, ang, -5, 14, 0.35, mh, mh + 0.9, Y), cbox(c, ang, -5, -2.6, 0.7, mh - 0.8, mh + 1.4, "#555"),
            cbox(c, 0, -0.9, 0.9, 0.9, mh, mh + 1.9, "#e8b020"), cbox(c, ang, hook - 0.08, hook + 0.08, 0.08, mh - 5, mh, "#333"),
            cbox(c, ang, hook - 0.9, hook + 0.9, 0.9, mh - 6.2, mh - 5, "#c0392b")];
  }
  // 주변 회색 건물: 속성 s(사용승인 시각)가 있으면 그때부터 보인다. 가림 처리(ctxOcc)와 시간 조건을 한 곳에서 합쳐 필터를 건다.
  let ctxOcc = [-1], ctxT = 9999, ctxN = -1;
  function applyCtx() {
    if (!map.getLayer("ctx-bld-x")) return false;
    const tm = ["all", ["!=", ["get", "hide"], 1], ["any", ["!", ["has", "s"]], ["<=", ["get", "s"], ctxT]]], nin = ["!", ["in", ["get", "cid"], ["literal", ctxOcc]]];
    map.setFilter("ctx-bld", ["all", tm, nin]);
    map.setFilter("ctx-roof", ["all", ["has", "rc"], tm, nin]);
    map.setFilter("ctx-bld-x", ["all", tm, ["in", ["get", "cid"], ["literal", ctxOcc]]]);
    if (map.getLayer("ctx-det")) {   // 사진으로 정밀 모델링한 주변 건물(독수리빌딩): 부모 건물이 가려지면 같이 반투명
      map.setFilter("ctx-det", ["!", ["in", ["get", "p"], ["literal", ctxOcc]]]);
      map.setFilter("ctx-det-x", ["in", ["get", "p"], ["literal", ctxOcc]]);
    }
    return true;
  }
  function updateCtx(T) {
    if (!S.context) return;
    let n = 0; for (const f of S.context.buildings.features) { const s = f.properties.s; if (s == null || s <= T) n++; }
    if (n !== ctxN) { const t0 = ctxT; ctxT = T; if (applyCtx()) ctxN = n; else ctxT = t0; }
  }
  const ghostColor = (g, q) => q > 0.35 ? "#8c867c" : g.color;
  let lastSig = "", lastDone = -1, curBld = [], occKey = "";
  function dyn(T) {
    const bld = [], crane = [], ghost = []; let nb = 0, prog = false;
    for (const f of S.buildings.features) {
      const p = f.properties;
      if (isBuilt(p, T)) { bld.push(f); if (!p.part) nb++; continue; }
      if (p.a == null || T < p.a) continue;
      const q = (T - p.a) / (p.b - p.a), hv = (bldH[p.bid] || p.height) * ease(q);
      prog = true;
      if (p.part) { if (p.base >= hv) continue; bld.push({ ...f, properties: { ...p, height: Math.min(p.height, hv) } }); }
      else { bld.push({ ...f, properties: { ...p, height: Math.min(p.height, hv) } }); if (p.hide !== 1) crane.push(...craneFeats(f, q, T)); }
      if (p.part && !crane.some(c => c._b === p.bid)) { const m = S.buildings.features.find(g => g.properties.bid === p.bid && !g.properties.part); if (m) { const cf = craneFeats(m, q, T); cf.forEach(x => x._b = p.bid); crane.push(...cf); } }
    }
    const ctxProg = [];   // 공사 중인 주변 건물(a≤T<b): 높이가 올라가고 크레인이 선다
    if (S.context) for (const f of S.context.buildings.features) {
      const p = f.properties;
      if (p.a == null || T < p.a || T >= p.b) continue;
      const q = (T - p.a) / (p.b - p.a), g = { ...f, properties: { ...p, height: Math.max(p.height * ease(q), 0.3), bid: "C" + p.cid } };
      if (p.hide !== 1) ctxProg.push(g);   // hide=1: 정밀 모델이 따로 올라간다(아래 ctxDet)
      crane.push(...craneFeats(g, q, T)); prog = true;
    }
    const ctxDet = [];   // 정밀 모델 조각: 완공 후엔 전부, 공사 중엔 높이 비율만큼 아래층부터
    if (S.context?.details) for (const f of S.context.details.features) {
      const p = f.properties;
      if (p.a != null && T < p.a) continue;
      if (p.b == null || T >= p.b) { ctxDet.push(f); continue; }
      const hv = p.H * ease((T - p.a) / (p.b - p.a));
      if (p.base < hv) ctxDet.push({ ...f, properties: { ...p, height: Math.min(p.height, hv) } });
    }
    for (const f of S.ghosts.features) {
      const g = f.properties;
      if (T >= g.dend || (g.gs != null && T < g.gs)) continue;   // gs: 옛 건물이 지어지기 전에는 안 보인다
      if (T < g.dstart) { ghost.push(f); continue; }
      prog = true; const q = (T - g.dstart) / (g.dend - g.dstart), k = Math.max(1 - q, 0.06), sh = Math.sin(T * 300) * 0.25 * (1 - q);
      const sx = sh / KXm;
      ghost.push({ type: "Feature", geometry: { type: "Polygon", coordinates: f.geometry.coordinates.map(r => r.map(([x, y]) => [x + sx, y])) },
                   properties: { ...g, base: g.base * k, top: Math.max(g.top * k, 0.3), color: ghostColor(g, q) } });
    }
    const sig = prog ? "p" + Math.round(T * 240) : "s" + bld.length + ":" + ghost.length + ":" + ctxDet.length;
    return { bld, crane, ghost, ctxProg, ctxDet, sig, nb };
  }
  // 지도 소스 갱신은 PUSH_MS 에 한 번만 보낸다. 재생 중 프레임마다(60Hz) 큰 GeoJSON 을 setData 하면 MapLibre 워커가 직전 로딩을
  // 계속 취소(abandoned)해서, 재생이 끝날 때까지 건물이 화면에 반영되지 않는다(완공된 건물이 한참 뒤에야 나타나는 문제).
  // 건너뛴 갱신은 버리지 않고 맨 마지막 상태를 뒤따라 보낸다.
  const PUSH_MS = 120;
  let lastPush = 0, pendingPush = null, pushTimer = 0;
  function pushDyn(d) {
    map.getSource("buildings").setData({ type: "FeatureCollection", features: d.bld });
    map.getSource("cranes").setData({ type: "FeatureCollection", features: d.crane });
    map.getSource("ghosts").setData({ type: "FeatureCollection", features: d.ghost });
    map.getSource("ctx-prog")?.setData({ type: "FeatureCollection", features: d.ctxProg });
    map.getSource("ctx-det")?.setData({ type: "FeatureCollection", features: d.ctxDet });
  }
  function schedulePush(d) {
    const wait = PUSH_MS - (performance.now() - lastPush);
    if (wait <= 0 && !pushTimer) { lastPush = performance.now(); pushDyn(d); return; }
    pendingPush = d;
    if (!pushTimer) pushTimer = setTimeout(() => {
      pushTimer = 0; lastPush = performance.now();
      const p = pendingPush; pendingPush = null; if (p) pushDyn(p);
    }, Math.max(wait, 0));
  }
  function refreshDyn(T, force) {
    updateCtx(T);
    const d = dyn(T);
    if (force || d.sig !== lastSig) {
      lastSig = d.sig;
      curBld = d.bld; occKey = "";
      schedulePush(d);
    }
    return d.nb;
  }
  const setYearLabel = T => { const y = yearOf(T), m = Math.min(12, Math.floor((T - y) * 12 + 1e-6) + 1);
    document.getElementById("year").innerHTML = `${y}<span style="font-size:.45em;opacity:.55;margin-left:4px">${m}월</span>`; };

  const START_VIEW = RG.start_view;
  const map = new maplibregl.Map({
    container: "map", style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": "#e9e6df" } }] },
    locale: { "NavigationControl.ZoomIn": "확대 ( = 또는 + )", "NavigationControl.ZoomOut": "축소 ( - )",
              "NavigationControl.ResetBearing": "북쪽을 위로 ( \\ )" },
    center: START_VIEW.center, zoom: START_VIEW.zoom, pitch: START_VIEW.pitch, bearing: START_VIEW.bearing, maxPitch: 85, maxZoom: 26
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: true }));
  map.keyboard.disable();   // 방향키는 직접 처리(날기: 화면 이동, 걷기: 이동)
  const keyBtns = [];
  class Rot {
    onAdd() {
      this.el = document.createElement("div"); this.el.className = "maplibregl-ctrl maplibregl-ctrl-group rotgrid";
      // 왼쪽 열: 좌우 30° 회전, 오른쪽 열: 시점 높낮이(누르고 있으면 계속 기울어진다)
      [["↺", -30, "반시계 30° 회전 ( [ 또는 Q )"], ["↑", "KeyR", "시점 올리기 · 수평 쪽으로 ( R 또는 PageUp )"],
       ["↻", 30, "시계 30° 회전 ( ] 또는 E )"], ["↓", "KeyF", "시점 내리기 · 내려다보기 ( F 또는 PageDown )"]].forEach(([t, d, tip]) => {
        const b = document.createElement("button"); b.className = "rot"; b.textContent = t; b.title = tip;
        if (typeof d === "number") b.onclick = () => rotate(d);
        else {
          b.dataset.code = d; keyBtns.push(b);
          b.addEventListener("pointerdown", e => { e.preventDefault();
            if (walking) keys.add(d);
            else map.easeTo({ pitch: clampP(map.getPitch() + (d === "KeyR" ? 10 : -10)), duration: 250 }); });
          ["pointerup", "pointerleave"].forEach(ev => b.addEventListener(ev, () => keys.delete(d)));
        }
        this.el.appendChild(b);
      });
      return this.el;
    }
    onRemove() { this.el.remove(); }
  }
  map.addControl(new Rot());
  // 조작 키 안내: 누르고 있으면 해당 키를 누른 것과 같다(걷기 모드), ↑↓는 날기 모드에서도 시점 높이를 바꾼다
  const KEYPAD = [
    ["", null], ["W", "KeyW", "앞으로 ( W 또는 ↑ )"], ["", null],
    ["A", "KeyA", "왼쪽으로 ( A 또는 ← )"], ["S", "KeyS", "뒤로 ( S 또는 ↓ )"], ["D", "KeyD", "오른쪽으로 ( D 또는 → )"]];
  class Keys {
    onAdd() {
      this.el = document.createElement("div"); this.el.className = "maplibregl-ctrl maplibregl-ctrl-group keys";
      KEYPAD.forEach(([t, code, tipText]) => {
        if (!code) { const g = document.createElement("span"); g.className = "gap"; this.el.appendChild(g); return; }
        const b = document.createElement("button"); b.textContent = t; b.title = tipText; b.dataset.code = code;
        b.addEventListener("pointerdown", e => { e.preventDefault(); keys.add(code); });
        ["pointerup", "pointerleave"].forEach(ev => b.addEventListener(ev, () => keys.delete(code)));
        keyBtns.push(b); this.el.appendChild(b);
      });
      return this.el;
    }
    onRemove() { this.el.remove(); }
  }
  map.addControl(new Keys());
  // 키 → 버튼 대응(키를 누르는 동안 해당 버튼이 파랗게 켜진다). 단축키가 둘이면 둘 다 적용
  const litBtns = [], lit = (el, codes) => { if (el) { el.dataset.codes = codes; litBtns.push(el); } };
  const ctl = document.querySelector(".maplibregl-ctrl-group");
  lit(document.querySelector(".maplibregl-ctrl-zoom-in"), "Equal NumpadAdd");
  lit(document.querySelector(".maplibregl-ctrl-zoom-out"), "Minus NumpadSubtract");
  lit(document.querySelector(".maplibregl-ctrl-compass"), "Backslash");
  const KC = { "↺": "BracketLeft KeyQ", "↻": "BracketRight KeyE", "↑": "KeyR PageUp", "↓": "KeyF PageDown",
               W: "KeyW ArrowUp", A: "KeyA ArrowLeft", S: "KeyS ArrowDown", D: "KeyD ArrowRight" };
  document.querySelectorAll("button.rot, .keys button").forEach(b => lit(b, KC[b.textContent]));
  // 기본 title 툴팁은 환경에 따라 뜨지 않으므로 직접 그린다
  const tip = document.getElementById("tip");
  document.querySelectorAll(".maplibregl-ctrl-group button").forEach(b => {
    const t = b.title; if (!t) return; b.dataset.tip = t; b.removeAttribute("title");
    b.addEventListener("mouseenter", () => { const r = b.getBoundingClientRect();
      tip.textContent = t; tip.style.left = (r.left - 8) + "px"; tip.style.top = (r.top + r.height / 2) + "px"; tip.style.display = "block"; });
    b.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
  function rotate(d) {
    if (walking) { heading = (heading + d + 360) % 360; applyWalkCam(); }
    else map.easeTo({ bearing: map.getBearing() + d, duration: 350 });
  }

  map.on("load", () => {
    // 출발점: 연세로12길 입구 쪽에서 창천교회와 독수리다방(31-4) 사이 골목을 정면으로 바라보는 시점
    map.jumpTo(START_VIEW);
    // 주변 맥락(창천교회 반경 300m). 도로(지목 도)는 전부 회색, 반경 150m(r150) 필지는 업소 근거 색, 그 밖은 조사 전이라 흐리게.
    if (S.context) {
      map.addSource("ctx-parcels", { type: "geojson", data: S.context.parcels, promoteId: "jibun" });
      S.context.buildings.features.forEach((f, i) => { f.properties.cid = i; bldH["C" + i] = f.properties.height || 10; });
      map.addSource("ctx-prog", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addSource("ctx-bld", { type: "geojson", data: S.context.buildings });
      map.addSource("ctx-ring", { type: "geojson", data: S.context.boundary });
      // 반경 150m 안(r150)은 핵심 필지와 같은 규칙: 그 해 업소 근거가 있으면 녹색, 없으면 흰색. 150m 밖은 조사 전이라 베이지.
      map.addLayer({ id: "ctx-fill", type: "fill", source: "ctx-parcels", paint: {
        "fill-color": ["case", ["==", ["get", "jimok"], "도"], "#d4d4d4",
          ["==", ["get", "r150"], 1], ["case", ["==", ["feature-state", "evidence"], true], "#cfd8c4", "#f4f1ea"],
          "#efede8"], "fill-opacity": ["case", ["==", ["get", "jimok"], "도"], 1, ["==", ["get", "r150"], 1], 1, 0.85] } });
      map.addLayer({ id: "ctx-line", type: "line", source: "ctx-parcels", paint: { "line-color": "#c9c5bc", "line-width": 0.5 } });
      const noneJ = ["==", ["get", "jibun"], ""];   // 선택한 주변 필지 강조(핵심 필지의 parcel-sel 과 같은 모양)
      map.addLayer({ id: "ctx-sel-fill", type: "fill", source: "ctx-parcels", filter: noneJ, paint: { "fill-color": "#d33", "fill-opacity": 0.18 } });
      map.addLayer({ id: "ctx-sel", type: "line", source: "ctx-parcels", filter: noneJ, paint: { "line-color": "#d33", "line-width": 4 } });
      // 주변 건물 색: wc=벽(3D 사진 팔레트), rc=지붕(위성사진 표본). 지붕이 있는 건물은 맨 위 0.4m를 지붕 레이어로 따로 칠한다.
      const CWALL = ["coalesce", ["get", "wc"], "#d6d3cc"], CTOP = ["case", ["has", "rc"], ["max", 0.3, ["-", ["get", "height"], 0.4]], ["get", "height"]];
      map.addLayer({ id: "ctx-bld", type: "fill-extrusion", source: "ctx-bld", paint: {
        "fill-extrusion-color": CWALL, "fill-extrusion-height": CTOP, "fill-extrusion-opacity": 0.82 } });
      map.addLayer({ id: "ctx-roof", type: "fill-extrusion", source: "ctx-bld", filter: ["has", "rc"], paint: {
        "fill-extrusion-color": ["get", "rc"], "fill-extrusion-base": CTOP, "fill-extrusion-height": ["get", "height"], "fill-extrusion-opacity": 0.9 } });
      map.addLayer({ id: "ctx-prog", type: "fill-extrusion", source: "ctx-prog", paint: {   // 공사 중인 주변 건물
        "fill-extrusion-color": CWALL, "fill-extrusion-height": ["get", "height"], "fill-extrusion-opacity": 0.9 } });

    if (on) { qInput.blur(); hintPrev = hint.innerHTML; hint.textContent = PLACE_HINT; window.Avatar?.held().show(mx, my); window.Avatar?.held().setValid(true); }
    else { hint.innerHTML = hintPrev; map.getCanvas().style.cursor = ""; }
  }
  function tryDrop(pt) {
    const spot = dropSpot(pt);
    if (!spot) { hint.textContent = "여기는 걸을 수 없는 곳이에요. 파란 길 위에 놓아 주세요."; clearTimeout(hintHold);
      hintHold = setTimeout(() => { if (placing) hint.textContent = PLACE_HINT; }, 2200); window.Avatar?.held().setValid(false); return; }
    window.Avatar?.held().hide(true);
    setPlacing(false);
    pos = spot; heading = map.getBearing(); face = heading;   // 보고 있던 방향 그대로 서서 걷기 시작
    setWalking(true);
  }
  window.addEventListener("mousemove", e => {
    if (!placing) return;
    const h = window.Avatar?.held(); h?.move(e.clientX, e.clientY);
    hoverPt = e; if (hoverRaf) return;
    hoverRaf = requestAnimationFrame(() => { hoverRaf = 0; if (!placing || !hoverPt) return;   // 놓을 수 있는 곳 위에서만 또렷하게
      const ok = hoverPt.target === map.getCanvas() && !!dropSpot(canvasPt(hoverPt));
      h?.setValid(ok); map.getCanvas().style.cursor = ok ? "pointer" : ""; });
  });
  window.addEventListener("keydown", e => { if (placing && e.key === "Escape") { window.Avatar?.held().hide(false); setPlacing(false); } }, true);
  modeBtn.onclick = e => {
    if (walking) setWalking(false);
    else if (placing) { window.Avatar?.held().hide(false); setPlacing(false); }
    else setPlacing(true, e.clientX, e.clientY);
  };
  window.addEventListener("avatar-ready", () => { window.Avatar.setVisible(walking); if (walking) drawMe(); });
  // 한글 입력 상태에서도 같은 키로 인식: code가 비거나 엉뚱할 때 key(자모)·keyCode로 되살린다
  const JAMO = { "ㅈ": "KeyW", "ㅁ": "KeyA", "ㄴ": "KeyS", "ㅇ": "KeyD", "ㅂ": "KeyQ", "ㄷ": "KeyE", "ㄱ": "KeyR", "ㄹ": "KeyF",
                 "ㅉ": "KeyW", "ㅃ": "KeyQ", "ㄸ": "KeyE", "ㄲ": "KeyR", "ㅆ": "KeyS" };
  const KCODE = { 87: "KeyW", 65: "KeyA", 83: "KeyS", 68: "KeyD", 81: "KeyQ", 69: "KeyE", 82: "KeyR", 70: "KeyF" };
  const kc = e => /^(Key[A-Z]|Arrow|Shift|Bracket|Page|Space|Backslash|Equal|Minus|Numpad)/.test(e.code || "") ? e.code
    : JAMO[e.key] || (/^[a-z]$/i.test(e.key || "") ? "Key" + e.key.toUpperCase() : "") || KCODE[e.keyCode] || e.code || "";
  // 글자를 입력하는 칸(검색창, 에이전트 입력창 등)에 포커스가 있으면 지도 단축키를 쓰지 않는다
  const typing = t => !!t && (t.isContentEditable || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && /^(text|search|url|email|tel|password|number|)$/.test(t.type || "")));
  window.addEventListener("keydown", ev => {
    const e = { code: kc(ev), ctrlKey: ev.ctrlKey, metaKey: ev.metaKey, altKey: ev.altKey, target: ev.target,
                preventDefault: () => ev.preventDefault(), stopPropagation: () => ev.stopPropagation() };
    if (typing(e.target) || typing(document.activeElement)) return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.code === "Backslash") { e.preventDefault(); e.stopPropagation(); if (walking) { heading = 0; face = 0; wpitch = WP_DEF; wdist = WD_DEF; applyWalkCam(); } else map.resetNorth(); return; }
      if (/^(Equal|NumpadAdd)$/.test(e.code)) { e.preventDefault(); e.stopPropagation(); if (walking) setDist(1 / 1.25); else map.zoomIn(); return; }
      if (/^(Minus|NumpadSubtract)$/.test(e.code)) { e.preventDefault(); e.stopPropagation(); if (walking) setDist(1.25); else map.zoomOut(); return; }
    }
    if (/^(KeyR|KeyF|PageUp|PageDown)$/.test(e.code) && !e.ctrlKey && !e.metaKey) {   // 시점 위아래
      e.preventDefault(); const up = /^(KeyR|PageUp)$/.test(e.code);
      if (walking) keys.add(up ? "KeyR" : "KeyF");
      else map.easeTo({ pitch: clampP(map.getPitch() + (up ? 10 : -10)), duration: 250 });
      return;
    }
    if (/^(KeyQ|KeyE|BracketLeft|BracketRight)$/.test(e.code)) { rotate(/^(KeyQ|BracketLeft)$/.test(e.code) ? -30 : 30); return; }
    if (/^Shift(Left|Right)$/.test(e.code)) { keys.add(e.code); return; }   // 달리기(걷기)·빠르게(날기)
    if (!e.ctrlKey && !e.metaKey && !e.altKey && /^(Key[WASD]|Arrow(Up|Down|Left|Right))$/.test(e.code)) { e.preventDefault(); keys.add(e.code); document.activeElement.blur?.(); }
  }, true);
  window.addEventListener("keyup", ev => { const c = kc(ev); keys.delete(c); if (c === "PageUp") keys.delete("KeyR"); if (c === "PageDown") keys.delete("KeyF"); });
  // 걷기 모드: 마우스를 누른 채 끌면 1인칭 게임처럼 둘러본다(좌우 = 방향, 위아래 = 시선 높이)
  { const cv = map.getCanvas(); let drag = null;
    cv.addEventListener("wheel", e => { if (!walking) return; e.preventDefault(); setDist(e.deltaY > 0 ? 1.12 : 1 / 1.12); }, { passive: false });
    cv.addEventListener("mousedown", e => { if (walking && e.button === 0) drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
    window.addEventListener("mousemove", e => { if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      heading = (heading + dx * 0.25 + 360) % 360; wpitch = clampW(wpitch - dy * 0.2); applyWalkCam();
      if (drag.moved > 4) cv.style.cursor = "grabbing"; });
    window.addEventListener("mouseup", () => { if (!drag) return; lookDragged = drag.moved > 4; drag = null; cv.style.cursor = "";
      setTimeout(() => lookDragged = false, 0); }); }
  window.addEventListener("blur", () => { keys.clear(); pressed.clear(); });
  window.addEventListener("keydown", e => { if (!typing(e.target)) { const c = kc(e); pressed.add(c); flash.set(c, performance.now() + 180); } }, true);
  window.addEventListener("keyup", e => pressed.delete(kc(e)), true);

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    if (playing) {   // 소수 연도로 매끄럽게 흐른다(1×는 초당 1년). 연이 바뀌거나 건물이 준공될 때만 전체 갱신
      let v = +slider.value + dt * SPEEDS[si], ended = false;
      if (v >= +slider.max) { if (loopChk.checked) v = +slider.min; else { v = +slider.max; setPlaying(false); ended = true; } }
      slider.value = v;
      const T = Tnow(), nb = isFinite(T) ? refreshDyn(T) : lastDone;
      if (ended || yearOf(T) !== lastY || nb !== lastDone) update(); else setYearLabel(T);   // 재생이 끝나면 마지막 상태를 강제로 다시 그린다(크레인 등 공사 연출이 남지 않게)
    }
    litBtns.forEach(b => b.classList.toggle("on", b.dataset.codes.split(" ").some(c => pressed.has(c) || keys.has(c) || (flash.get(c) || 0) > t)));
    if (walking) {
      const k = c => keys.has(c); let moved = false;
      const tilt = (k("KeyR") ? 1 : 0) - (k("KeyF") ? 1 : 0);
      if (tilt) wpitch = clampW(wpitch + tilt * 60 * dt);
      if (Math.abs(wpitch - wps) > 0.02) { wps += (wpitch - wps) * Math.min(1, dt * 16); moved = true; }   // 시점은 목표값을 향해 부드럽게 따라간다
      if (occDirty && t - lastOcc > 120) { occDirty = false; lastOcc = t; updateOccluders(); }
      const f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) {
        const sp = (k("ShiftLeft") || k("ShiftRight") ? 3.5 : 1.4) * dt, h = heading * Math.PI / 180;
        const dx = (Math.sin(h) * f + Math.cos(h) * sd) * sp, dy = (Math.cos(h) * f - Math.sin(h) * sd) * sp;
        const stuck = blocked(pos[0], pos[1]);   // 연도를 바꿔 내 자리에 건물이 생겼다면 벽을 무시하고 빠져나온다
        const nx = pos[0] + dx / KX, ny = pos[1] + dy / KY;   // 벽에 막히면 한 축씩 미끄러진다
        if (stuck || !blocked(nx, ny)) pos = [nx, ny]; else if (!blocked(nx, pos[1])) pos = [nx, pos[1]]; else if (!blocked(pos[0], ny)) pos = [pos[0], ny];
        moved = true;
        const want = Math.atan2(dx, dy) * 180 / Math.PI, diff = ((want - face + 540) % 360) - 180;   // 이동 방향으로 몸을 돌린다
        face = (face + diff * Math.min(1, dt * 12) + 360) % 360;
        anim = k("ShiftLeft") || k("ShiftRight") ? "sprint" : "walk";
      } else if (anim !== "idle") { anim = "idle"; moved = true; }
      if (moved) applyWalkCam();
    } else {   // 날기 모드: W/A/S/D로 화면 기준 앞·뒤·좌·우로 지도를 민다
      const k = c => keys.has(c), f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) { const px = (k("ShiftLeft") || k("ShiftRight") ? 700 : 280) * dt; map.panBy([sd * px, -f * px], { duration: 0 }); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { lastT = t; frame(t); });
  window.__scene = S; window.__map = map; window.__walkTo = p => { pos = p; applyWalkCam(); };
}
</script>
</body>
