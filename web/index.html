<script>
const FIRST_SURVEY = 2008;  // 로드뷰 간판 조사 첫 해
init(window.SCENE);

function init(S) {
  const bizByParcel = {};
  S.businesses.forEach(b => (bizByParcel[b.jibun] ||= []).push(b));
  const evByParcel = {};
  S.building_events.forEach(e => (evByParcel[e.jibun] ||= []).push(e));
  const yr = s => s ? parseInt(s.slice(0, 4)) : null;
  const coreJ = new Set(S.parcels.features.map(f => f.properties.jibun));
  const anchorOf = {};   // 필지의 대표 장소 이름(창천감리교회 등): 인허가 업소가 없어도 라벨을 단다
  S.parcels.features.forEach(f => f.properties.anchor && (anchorOf[f.properties.jibun] = f.properties.anchor));

  // 그 해에 영업 근거가 있는 업소. 등급 A: 인허가~폐업(없으면 열림), 등급 C: 첫~마지막 간판 관찰
  function activeBiz(jibun, y) {
    return (bizByParcel[jibun] || []).filter(b => {
      if (b.grade === "C") return yr(b.sign_first) <= y && y <= yr(b.sign_last);
      const s = yr(b.start), e = yr(b.end);
      return s <= y && (e == null || y <= e);
    });
  }
  // ---- 시간 T는 소수 연도(1993.5 = 1993년 중반). 공사 중(a≤T<b)인 건물은 크레인과 함께 올라가고, 완공(T≥b)이면 전체가 보인다.
  const KXm = 111320 * Math.cos(37.559 * Math.PI / 180), KYm = 110540;
  const Tnow = () => +document.getElementById("slider").value;
  const yearOf = T => Math.floor(T + 1e-6);
  const isBuilt = (p, T) => p.a != null ? T >= p.b : p.start <= yearOf(T);
  const buildingsAt = T => S.buildings.features.filter(f => isBuilt(f.properties, T));
  const ease = p => p * p * (3 - 2 * p);
  const bldH = {};   // 건물별 최종 높이(부위 있으면 부위 최고 높이)
  S.buildings.features.forEach(f => { const p = f.properties; bldH[p.bid] = Math.max(bldH[p.bid] || 0, p.height || 0); });
  const rectLL = (c, ang, a0, a1, hw) => {   // c 기준 방향 ang(rad)으로 a0~a1 m, 폭 ±hw m 직사각형(경위도)
    const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
    return [[a0, -hw], [a1, -hw], [a1, hw], [a0, hw], [a0, -hw]].map(([a, w]) => [c[0] + (ux * a + nx * w) / KXm, c[1] + (uy * a + ny * w) / KYm]);
  };
  const cbox = (c, ang, a0, a1, hw, base, top, color) => ({ type: "Feature", geometry: { type: "Polygon", coordinates: [rectLL(c, ang, a0, a1, hw)] }, properties: { base, top, color } });
  function craneFeats(f, p, T) {   // 타워크레인: 기둥 + 회전하는 붐 + 균형추 + 매달린 짐
    const ring = f.geometry.coordinates[0], c = ringMid(ring), H = bldH[f.properties.bid] || 10;
    const mh = Math.max(12, H * ease(p) + 8), seed = f.properties.bid.split("").reduce((a, ch) => a + ch.charCodeAt(0), 0);
    const ang = seed + T * 5, Y = "#f2c230";
    const hook = 12 + 3 * Math.sin(T * 40 + seed);
    return [cbox(c, 0, -0.6, 0.6, 0.6, 0, mh, Y), cbox(c, ang, -5, 14, 0.35, mh, mh + 0.9, Y), cbox(c, ang, -5, -2.6, 0.7, mh - 0.8, mh + 1.4, "#555"),
            cbox(c, 0, -0.9, 0.9, 0.9, mh, mh + 1.9, "#e8b020"), cbox(c, ang, hook - 0.08, hook + 0.08, 0.08, mh - 5, mh, "#333"),
            cbox(c, ang, hook - 0.9, hook + 0.9, 0.9, mh - 6.2, mh - 5, "#c0392b")];
  }
  // 주변 회색 건물: 속성 s(사용승인 시각)가 있으면 그때부터 보인다. 가림 처리(ctxOcc)와 시간 조건을 한 곳에서 합쳐 필터를 건다.
  let ctxOcc = [-1], ctxT = 9999, ctxN = -1;

        return tmax >= 0 && Math.min(hAt(tmin), hAt(tmax)) < H;
      };
      const seen = new Set();
      curBld.forEach(f => { const p = f.properties; if (!seen.has(p.bid) && hit(f.geometry.coordinates[0], p.height || 0)) seen.add(p.bid); });
      bids = [...seen];
      S.context.buildings.features.forEach(f => { if (hit(f.geometry.coordinates[0], f.properties.height || 0)) cids.push(f.properties.cid); });
    }
    const key = bids.join() + "|" + cids.join(); if (key === occKey) return; occKey = key;
    const B = bids.length ? bids : [""], C = cids.length ? cids : [-1], hide = ["!=", ["get", "hide"], 1];
    map.setFilter("bld", ["all", hide, ["!", ["in", ["get", "bid"], ["literal", B]]]]);
    map.setFilter("bld-roof", ["all", ["has", "rc"], ["==", ["get", "part"], 0], hide, ["!", ["in", ["get", "bid"], ["literal", B]]]]);
    map.setFilter("bld-x", ["all", hide, ["in", ["get", "bid"], ["literal", B]]]);
    if (map.getLayer("ctx-bld-x")) {
      ctxOcc = C; applyCtx();
    }
  }
  function setWalking(on) {
    walking = on; if (on) { qInput.blur(); if (isolate) { isolate = false; applyFloor(); renderStack(); } }   // 검색창에 포커스가 남아 있으면 WASD가 무시된다. 걷기 모드는 자체 가림 처리를 쓰므로 '단독 보기'를 푼다
    modeBtn.textContent = on ? "🦅 날기 모드" : "🚶 걷기 모드"; modeBtn.classList.toggle("on", on);
    ["dragPan", "dragRotate", "touchZoomRotate", "doubleClickZoom", "scrollZoom"].forEach(k => map[k][on ? "disable" : "enable"]());
    map.setLayoutProperty("me", "visibility", on ? "visible" : "none"); window.Avatar?.setVisible(on);
    if (on) { wps = wpitch; map.transform.fov = WFOV; if (!pos) { pos = startPos(); face = heading; } anim = "idle"; applyWalkCam(); lastT = performance.now(); }
    else { map.transform.fov = FOV0; updateOccluders(); map.setPadding({ top: 0, right: 0, bottom: 0, left: 0 }); map.easeTo({ pitch: 55, zoom: 18, duration: 600 }); }
    hint.innerHTML = !on ? "W/A/S/D·방향키 이동 · [ ] 회전 · R/F 위아래 · Shift 빠르게"
      : "W/A/S/D·방향키 이동 · Shift 달리기 · 마우스 드래그 둘러보기 · [ ] 회전 · R/F 위아래 · +/- 거리 · \\ 초기화";
  }
  // ---------- 걷기 모드 시작: 캐릭터를 커서에 매달고, 파란 길 위에 클릭해서 내려놓는다 ----------
  let placing = false, hoverRaf = 0, hoverPt = null, hintHold = 0, hintPrev = "";
  const PLACE_HINT = "캐릭터를 파란 길 위에 클릭해서 내려놓으세요 · 지도는 드래그·휠로 움직일 수 있어요 · Esc 취소";
  const overBuilding = q => { const L = ["bld", "ctx-bld"].filter(id => map.getLayer(id)); return map.queryRenderedFeatures([q.x, q.y], { layers: L }).length > 0; };
  // 화면 점 pt 근처에서 내려놓을 수 있는 자리(도로 필지 안, 건물 밖, 건물 지붕 아래가 아닌 곳). 없으면 null. 좁은 길을 위해 반경 20px 까지 봐 준다.
  function dropSpot(pt) {
    const tries = [[0, 0]]; [10, 20].forEach(r => { for (let k = 0; k < 8; k++) tries.push([r * Math.cos(k * Math.PI / 4), r * Math.sin(k * Math.PI / 4)]); });
    for (const [dx, dy] of tries) {
      const q = { x: pt.x + dx, y: pt.y + dy }, ll = map.unproject([q.x, q.y]);
      if (isFinite(ll.lng) && window.NpcWorld.free(ll.lng, ll.lat) && !overBuilding(q)) return [ll.lng, ll.lat];
    }
    return null;
  }
  const canvasPt = e => { const r = map.getCanvas().getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  function setPlacing(on, mx, my) {
    if (on === placing) return; placing = on;
    modeBtn.textContent = on ? "✖ 취소" : "🚶 걷기 모드"; modeBtn.classList.toggle("on", on);
    if (on) map.getSource("walk-roads").setData(walkFC);
    ["walk-road-fill", "walk-road-line"].forEach(id => map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
    clearTimeout(hintHold);
    if (on) { qInput.blur(); hintPrev = hint.innerHTML; hint.textContent = PLACE_HINT; window.Avatar?.held().show(mx, my); window.Avatar?.held().setValid(true); }
    else { hint.innerHTML = hintPrev; map.getCanvas().style.cursor = ""; }
  }
  function tryDrop(pt) {
    const spot = dropSpot(pt);
    if (!spot) { hint.textContent = "여기는 걸을 수 없는 곳이에요. 파란 길 위에 놓아 주세요."; clearTimeout(hintHold);
      hintHold = setTimeout(() => { if (placing) hint.textContent = PLACE_HINT; }, 2200); window.Avatar?.held().setValid(false); return; }
    window.Avatar?.held().hide(true);
    setPlacing(false);
    pos = spot; heading = map.getBearing(); face = heading;   // 보고 있던 방향 그대로 서서 걷기 시작
    setWalking(true);
  }
  window.addEventListener("mousemove", e => {
    if (!placing) return;
    const h = window.Avatar?.held(); h?.move(e.clientX, e.clientY);
    hoverPt = e; if (hoverRaf) return;
    hoverRaf = requestAnimationFrame(() => { hoverRaf = 0; if (!placing || !hoverPt) return;   // 놓을 수 있는 곳 위에서만 또렷하게
      const ok = hoverPt.target === map.getCanvas() && !!dropSpot(canvasPt(hoverPt));
      h?.setValid(ok); map.getCanvas().style.cursor = ok ? "pointer" : ""; });
  });
  window.addEventListener("keydown", e => { if (placing && e.key === "Escape") { window.Avatar?.held().hide(false); setPlacing(false); } }, true);
  modeBtn.onclick = e => {
    if (walking) setWalking(false);
    else if (placing) { window.Avatar?.held().hide(false); setPlacing(false); }
    else setPlacing(true, e.clientX, e.clientY);
  };
  window.addEventListener("avatar-ready", () => { window.Avatar.setVisible(walking); if (walking) drawMe(); });
  // 한글 입력 상태에서도 같은 키로 인식: code가 비거나 엉뚱할 때 key(자모)·keyCode로 되살린다
  const JAMO = { "ㅈ": "KeyW", "ㅁ": "KeyA", "ㄴ": "KeyS", "ㅇ": "KeyD", "ㅂ": "KeyQ", "ㄷ": "KeyE", "ㄱ": "KeyR", "ㄹ": "KeyF",
                 "ㅉ": "KeyW", "ㅃ": "KeyQ", "ㄸ": "KeyE", "ㄲ": "KeyR", "ㅆ": "KeyS" };
  const KCODE = { 87: "KeyW", 65: "KeyA", 83: "KeyS", 68: "KeyD", 81: "KeyQ", 69: "KeyE", 82: "KeyR", 70: "KeyF" };
  const kc = e => /^(Key[A-Z]|Arrow|Shift|Bracket|Page|Space|Backslash|Equal|Minus|Numpad)/.test(e.code || "") ? e.code
    : JAMO[e.key] || (/^[a-z]$/i.test(e.key || "") ? "Key" + e.key.toUpperCase() : "") || KCODE[e.keyCode] || e.code || "";
  // 글자를 입력하는 칸(검색창, 에이전트 입력창 등)에 포커스가 있으면 지도 단축키를 쓰지 않는다
  const typing = t => !!t && (t.isContentEditable || t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && /^(text|search|url|email|tel|password|number|)$/.test(t.type || "")));
  window.addEventListener("keydown", ev => {
    const e = { code: kc(ev), ctrlKey: ev.ctrlKey, metaKey: ev.metaKey, altKey: ev.altKey, target: ev.target,
                preventDefault: () => ev.preventDefault(), stopPropagation: () => ev.stopPropagation() };
    if (typing(e.target) || typing(document.activeElement)) return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); return; }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
      if (e.code === "Backslash") { e.preventDefault(); e.stopPropagation(); if (walking) { heading = 0; face = 0; wpitch = WP_DEF; wdist = WD_DEF; applyWalkCam(); } else map.resetNorth(); return; }
      if (/^(Equal|NumpadAdd)$/.test(e.code)) { e.preventDefault(); e.stopPropagation(); if (walking) setDist(1 / 1.25); else map.zoomIn(); return; }
      if (/^(Minus|NumpadSubtract)$/.test(e.code)) { e.preventDefault(); e.stopPropagation(); if (walking) setDist(1.25); else map.zoomOut(); return; }
    }
    if (/^(KeyR|KeyF|PageUp|PageDown)$/.test(e.code) && !e.ctrlKey && !e.metaKey) {   // 시점 위아래
      e.preventDefault(); const up = /^(KeyR|PageUp)$/.test(e.code);
      if (walking) keys.add(up ? "KeyR" : "KeyF");
      else map.easeTo({ pitch: clampP(map.getPitch() + (up ? 10 : -10)), duration: 250 });
      return;
    }
    if (/^(KeyQ|KeyE|BracketLeft|BracketRight)$/.test(e.code)) { rotate(/^(KeyQ|BracketLeft)$/.test(e.code) ? -30 : 30); return; }
    if (/^Shift(Left|Right)$/.test(e.code)) { keys.add(e.code); return; }   // 달리기(걷기)·빠르게(날기)
    if (!e.ctrlKey && !e.metaKey && !e.altKey && /^(Key[WASD]|Arrow(Up|Down|Left|Right))$/.test(e.code)) { e.preventDefault(); keys.add(e.code); document.activeElement.blur?.(); }
  }, true);
  window.addEventListener("keyup", ev => { const c = kc(ev); keys.delete(c); if (c === "PageUp") keys.delete("KeyR"); if (c === "PageDown") keys.delete("KeyF"); });
  // 걷기 모드: 마우스를 누른 채 끌면 1인칭 게임처럼 둘러본다(좌우 = 방향, 위아래 = 시선 높이)
  { const cv = map.getCanvas(); let drag = null;
    cv.addEventListener("wheel", e => { if (!walking) return; e.preventDefault(); setDist(e.deltaY > 0 ? 1.12 : 1 / 1.12); }, { passive: false });
    cv.addEventListener("mousedown", e => { if (walking && e.button === 0) drag = { x: e.clientX, y: e.clientY, moved: 0 }; });
    window.addEventListener("mousemove", e => { if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      heading = (heading + dx * 0.25 + 360) % 360; wpitch = clampW(wpitch - dy * 0.2); applyWalkCam();
      if (drag.moved > 4) cv.style.cursor = "grabbing"; });
    window.addEventListener("mouseup", () => { if (!drag) return; lookDragged = drag.moved > 4; drag = null; cv.style.cursor = "";
      setTimeout(() => lookDragged = false, 0); }); }
  window.addEventListener("blur", () => { keys.clear(); pressed.clear(); });
  window.addEventListener("keydown", e => { if (!typing(e.target)) { const c = kc(e); pressed.add(c); flash.set(c, performance.now() + 180); } }, true);
  window.addEventListener("keyup", e => pressed.delete(kc(e)), true);

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1); lastT = t;
    if (playing) {   // 소수 연도로 매끄럽게 흐른다(1×는 초당 1년). 연이 바뀌거나 건물이 준공될 때만 전체 갱신
      let v = +slider.value + dt * SPEEDS[si], ended = false;
      if (v >= +slider.max) { if (loopChk.checked) v = +slider.min; else { v = +slider.max; setPlaying(false); ended = true; } }
      slider.value = v;
      const T = Tnow(), nb = isFinite(T) ? refreshDyn(T) : lastDone;
      if (ended || yearOf(T) !== lastY || nb !== lastDone) update(); else setYearLabel(T);   // 재생이 끝나면 마지막 상태를 강제로 다시 그린다(크레인 등 공사 연출이 남지 않게)
    }
    litBtns.forEach(b => b.classList.toggle("on", b.dataset.codes.split(" ").some(c => pressed.has(c) || keys.has(c) || (flash.get(c) || 0) > t)));
    if (walking) {
      const k = c => keys.has(c); let moved = false;
      const tilt = (k("KeyR") ? 1 : 0) - (k("KeyF") ? 1 : 0);
      if (tilt) wpitch = clampW(wpitch + tilt * 60 * dt);
      if (Math.abs(wpitch - wps) > 0.02) { wps += (wpitch - wps) * Math.min(1, dt * 16); moved = true; }   // 시점은 목표값을 향해 부드럽게 따라간다
      if (occDirty && t - lastOcc > 120) { occDirty = false; lastOcc = t; updateOccluders(); }
      const f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) {
        const sp = (k("ShiftLeft") || k("ShiftRight") ? 3.5 : 1.4) * dt, h = heading * Math.PI / 180;
        const dx = (Math.sin(h) * f + Math.cos(h) * sd) * sp, dy = (Math.cos(h) * f - Math.sin(h) * sd) * sp;
        const stuck = blocked(pos[0], pos[1]);   // 연도를 바꿔 내 자리에 건물이 생겼다면 벽을 무시하고 빠져나온다
        const nx = pos[0] + dx / KX, ny = pos[1] + dy / KY;   // 벽에 막히면 한 축씩 미끄러진다
        if (stuck || !blocked(nx, ny)) pos = [nx, ny]; else if (!blocked(nx, pos[1])) pos = [nx, pos[1]]; else if (!blocked(pos[0], ny)) pos = [pos[0], ny];
        moved = true;
        const want = Math.atan2(dx, dy) * 180 / Math.PI, diff = ((want - face + 540) % 360) - 180;   // 이동 방향으로 몸을 돌린다
        face = (face + diff * Math.min(1, dt * 12) + 360) % 360;
        anim = k("ShiftLeft") || k("ShiftRight") ? "sprint" : "walk";
      } else if (anim !== "idle") { anim = "idle"; moved = true; }
      if (moved) applyWalkCam();
    } else {   // 날기 모드: W/A/S/D로 화면 기준 앞·뒤·좌·우로 지도를 민다
      const k = c => keys.has(c), f = (k("KeyW") || k("ArrowUp") ? 1 : 0) - (k("KeyS") || k("ArrowDown") ? 1 : 0), sd = (k("KeyD") || k("ArrowRight") ? 1 : 0) - (k("KeyA") || k("ArrowLeft") ? 1 : 0);
      if (f || sd) { const px = (k("ShiftLeft") || k("ShiftRight") ? 700 : 280) * dt; map.panBy([sd * px, -f * px], { duration: 0 }); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(t => { lastT = t; frame(t); });
  window.__scene = S; window.__map = map; window.__walkTo = p => { pos = p; applyWalkCam(); };
}
